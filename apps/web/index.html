<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A self-hosted gallery for browsing image and video folders, building shortlists, and downloading the keepers." />
    <meta name="theme-color" content="#f5f5f6" />
    <meta name="apple-mobile-web-app-title" content="these" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>these</title>
    <script>
      (() => {
        const saved = localStorage.getItem("these.preferences.v1");
        const theme = saved ? JSON.parse(saved).theme : "system";
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
